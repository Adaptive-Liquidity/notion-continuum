name: PR CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/audit /tmp/gitleaks
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks/gitleaks.tar.gz' | sha256sum --check -
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Scan current source
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks/gitleaks dir \
            --redact \
            --no-banner \
            --gitleaks-ignore-path .gitleaksignore \
            --report-format json \
            --report-path .artifacts/audit/gitleaks-source.json \
            .

      - name: Scan reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks/gitleaks git \
            --redact \
            --no-banner \
            --gitleaks-ignore-path .gitleaksignore \
            --report-format json \
            --report-path .artifacts/audit/gitleaks-history.json \
            .

      - name: Upload redacted scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-scan-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/audit/gitleaks-*.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  canonical:
    name: Canonical local verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      CT_PG_BIN: /usr/lib/postgresql/17/bin

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node 22 for frontend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3

      - name: Record separate Node 22 binary
        shell: bash
        run: |
          set -euo pipefail
          echo "CT_NODE22_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
          node --version

      - name: Install Node 24 for backend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1

      - name: Install PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-client-17 python3 openssl
          "$CT_PG_BIN/postgres" --version
          "$CT_PG_BIN/initdb" --version

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test "$("$CT_NODE22_BIN/node" -p 'process.versions.node.split(".")[0]')" = 22
          npm ci --ignore-scripts

      - name: Install Chromium and system browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath())")"
          test -x "$CHROMIUM_PATH"
          echo "CT_CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      - name: Format check
        run: npm run format:check

      - name: Dependency audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/audit
          npm audit --omit=dev --json > .artifacts/audit/npm-audit-production.json
          npm audit --json > .artifacts/audit/npm-audit-complete.json

      - name: Install the root-owned fixture privilege helper
        shell: bash
        run: |
          set -euo pipefail
          sudo CT_FIXTURE_NODE="$(command -v node)" bash tools/install-fixture-priv.sh

      - name: Let the unprivileged fixture uid read the workspace
        shell: bash
        run: |
          set -euo pipefail
          chmod o+x "$HOME" "$HOME/work" "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE"
          chmod -R a+rX "$GITHUB_WORKSPACE"

      - name: Run guarded canonical verification
        shell: bash
        env:
          CT_RESET_LOCAL_FIXTURE: "yes"
          CT_RESET_CONSOLE_FIXTURE: "yes"
        run: |
          set -euo pipefail
          npm run test:canonical

      - name: Confirm production gates remain blocked
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run qualification-check > .artifacts/audit/qualification-check.log 2>&1
          q=$?
          npm run release-check > .artifacts/audit/release-check.log 2>&1
          r=$?
          set -e
          test "$q" -eq 1
          test "$r" -eq 1
          echo "Qualification and release enforcement remain intentionally blocked."

      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .artifacts/canonical/final/**
            .artifacts/implementation/final/**
            .artifacts/audit/**
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
